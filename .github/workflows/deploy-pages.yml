# Build TeaVM WebAssembly and deploy to GitHub Pages.
# Enable: Repo Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache gdx-teavm
        uses: actions/cache@v4
        with:
          path: tools/gdx-teavm
          key: gdx-teavm-1.5.6-${{ hashFiles('scripts/gdx-teavm-patches/girafferun.patch') }}

      - name: Setup gdx-teavm
        run: chmod +x scripts/setup-teavm.sh && ./scripts/setup-teavm.sh

      - name: Build WASM webapp
        run: chmod +x gradlew && ./gradlew :teavm:patchWebIndex --no-daemon

      - name: Add GitHub Pages files
        run: touch teavm/build/dist/webapp/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: teavm/build/dist/webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
