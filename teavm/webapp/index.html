<!DOCTYPE html>
<html lang="en">
    <head>
        <title>GiraffeRun</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <link rel="icon" type="image/png" href="./assets/backView.png">
        <link rel="apple-touch-icon" href="./assets/backView.png">
        <link rel="preload" href="./app.wasm" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="./wasm-gc-runtime.min.js" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
                touch-action: none;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #canvas {
                border: none;
                display: block;
                max-width: 100%;
                max-height: 100%;
            }
            #load-status {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 12px;
                text-align: center;
                color: #aaa;
                font: 12px/1.4 system-ui, sans-serif;
                pointer-events: none;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div>
            <canvas id="canvas"></canvas>
        </div>
        <div id="load-status" aria-live="polite">Loading…</div>
        <script type="text/javascript" charset="utf-8" src="./wasm-gc-runtime.min.js"></script>
        <script>
            (function () {
                var status = document.getElementById("load-status");
                function setStatus(msg) {
                    if (status) status.textContent = msg;
                }
                async function start() {
                    try {
                        var teavm = await TeaVM.wasmGC.load("./app.wasm");
                        setStatus("");
                        if (status) status.remove();
                        teavm.exports.main([]);
                    } catch (err) {
                        console.error(err);
                        setStatus("Failed to load game. Refresh or try another browser.");
                    }
                }
                window.addEventListener("load", start);
            })();
        </script>
    </body>
</html>
